<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>our little scrapbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page-wrap">

    <header class="board-header">
      <p class="eyebrow">a little digital scrapbook</p>
      <h1 class="title">
        <span id="bdayText">happy birthday my shivani buddy</span>
        <span class="heart-inline">♡</span>
      </h1>
      
      <div class="cake" aria-hidden="true">
        <svg viewBox="0 0 140 112" class="cake-svg">
          <!-- two-tier cake with frosting drips, 3 candles, 3 flame paths (.flame.c1/.c2/.c3) -->
        </svg>
      </div>
      
      <p class="subtitle">wishing you the happiest one yet</p>
    </header>

    <main id="collage" class="collage" aria-label="photo collage">
      <!-- background decor, stickers, doodles, tape and paper scraps are injected by script.js -->
    </main>

    <footer class="board-footer">
      <p>made with love, one sticker at a time</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
