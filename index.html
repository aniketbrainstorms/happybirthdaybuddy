<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>our little scrapbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page-wrap">

    <header class="board-header">
      <p class="eyebrow">a little digital scrapbook</p>
      <h1 class="title">
        <span id="bdayText">happy birthday shivani buddy</span>
        <span class="heart-inline">♡</span>
      </h1>

      <div class="cake" aria-hidden="true">
        <svg viewBox="0 0 140 112" class="cake-svg">
          <ellipse cx="70" cy="101" rx="52" ry="7" fill="rgba(91,58,69,.12)"/>
          <rect x="14" y="66" width="112" height="30" rx="8" fill="var(--tape-yellow)"/>
          <path d="M14 70 Q22 62 30 70 Q38 78 46 70 Q54 62 62 70 Q70 78 78 70 Q86 62 94 70 Q102 78 110 70 Q118 62 126 70 L126 96 L14 96 Z" fill="#FFFDF8"/>
          <rect x="34" y="40" width="72" height="26" rx="7" fill="var(--doodle-pink)"/>
          <path d="M34 44 Q41 36 48 44 Q55 52 62 44 Q69 36 76 44 Q83 52 90 44 Q97 36 104 44 L104 66 L34 66 Z" fill="#FFFDF8"/>
          <rect x="49" y="26" width="4" height="16" rx="2" fill="#F2897F"/>
          <rect x="68" y="22" width="4" height="20" rx="2" fill="#F2897F"/>
          <rect x="87" y="26" width="4" height="16" rx="2" fill="#F2897F"/>
          <path class="flame c1" d="M51 26 C48 22 51 17 51 14 C51 17 55 21 53 25 C52.5 27 51.5 27.5 51 26 Z" fill="#FFC24B"/>
          <path class="flame c2" d="M70 22 C67 18 70 13 70 10 C70 13 74 17 72 21 C71.5 23 70.5 23.5 70 22 Z" fill="#FFC24B"/>
          <path class="flame c3" d="M89 26 C86 22 89 17 89 14 C89 17 93 21 91 25 C90.5 27 89.5 27.5 89 26 Z" fill="#FFC24B"/>
        </svg>
      </div>

      <p class="subtitle">wishing you the happiest one yet</p>
    </header>

    <main id="collage" class="collage" aria-label="photo collage">
      <!-- background decor, stickers, doodles, tape and paper scraps are injected by script.js -->
    </main>

    <footer class="board-footer">
      <p>made with love, one sticker at a time</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
